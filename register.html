<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device=width , initial-scale1.0">
        <title>Register-Talent Bridge</title>
        <style>
            body{
                background-color: #0b0e17;
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .register-box{
                background: linear-gradient(135deg,#1e293b,#0f172a);
                padding: 40px;
                border-radius: 12px;
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 10px 30px rgba(0,0,0,0,0.5);
                text-align: center;
                width: 100%;
                max-width: 400px;
            }
            .register-box h2{
                margin-bottom: 20px;
            }
            .register-box input{
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                border-radius: 6px;
                border: 1px solid rgba(255,255,255,0.2);
                background: rgba(255,255,255,0.5);
                color: white;
            }
            .register-box button{
                width: 100%;
                padding: 12px;
                background-color: #3b82f6;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                margin-top: 15px;
                font-weight: bold;
            }
            .register-box a{
                color: #3b82f6;
                text-decoration: none;
                display: block;
                margin-top: 15px;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="register-box">
            <h2>Get Started</h2>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="password" placeholder="Password">
        <div class="back-home-container">
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
        </div>
    </body>
</html>
